name: GiWiFi
options:
  bundleIdPrefix: com.giwifi
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_BITCODE: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.3.2"
    CURRENT_PROJECT_VERSION: "10"

targets:
  GiWiFi:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giwifi.ios
        PRODUCT_NAME: GiWiFi
        INFOPLIST_FILE: Support/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: NO
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: GiWiFi 助手
        CFBundleShortVersionString: "1.3.2"
        CFBundleVersion: "10"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        NSLocalNetworkUsageDescription: 需要访问校园网网关完成 GiWiFi 认证，并读取当前 Wi-Fi 的局域网地址。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

schemes:
  GiWiFi:
    build:
      targets:
        GiWiFi: all
    run:
      config: Release
    archive:
      config: Release

configs:
  Debug: debug
  Release: release
